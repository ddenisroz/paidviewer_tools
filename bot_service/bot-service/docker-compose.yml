version: '3.8'

services:
  bot-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TWITCH_TOKEN=${TWITCH_TOKEN}
      - TWITCH_CHANNELS=${TWITCH_CHANNELS}
      - TTS_SERVICE_URL=${TTS_SERVICE_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
