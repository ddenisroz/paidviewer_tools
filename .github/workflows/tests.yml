name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run quality checks (lint + format + type-check)
      run: |
        cd frontend
        npm run check:all
    
    - name: Report quality check results
      if: failure()
      run: |
        echo "Frontend quality checks failed."
        echo "Please run 'npm run check:all' locally to see detailed errors"
        exit 1

  backend-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.12]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        cd bot_service
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run backend tests
      run: |
        cd bot_service
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./bot_service/coverage.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run frontend tests
      run: |
        cd frontend
        npm run test:run
    
  release-gate:
    runs-on: ubuntu-latest
    needs:
      - frontend-quality
      - backend-tests
      - frontend-tests

    env:
      BOT_SERVICE_IMAGE: ghcr.io/example/paidviewer-bot-service:release-test
      FRONTEND_IMAGE: ghcr.io/example/paidviewer-frontend:release-test
      TTS_GATEWAY_IMAGE: ghcr.io/example/tts-gateway:release-test
      F5_TTS_IMAGE: ghcr.io/example/f5-tts-service:release-test
      QWEN_TTS_IMAGE: ghcr.io/example/nano-qwen3tts-vllm:release-test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install backend dependencies
      run: |
        cd bot_service
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run backend smoke suites
      run: |
        cd bot_service
        python -m pytest tests/test_simple_api.py tests/test_all_systems.py tests/test_local_tts_routes_contract.py tests/test_security_regressions.py tests/test_api_tts.py tests/test_vk_bot_oauth.py tests/test_vk_role_parity.py tests/test_drops_functionality.py tests/test_youtube_queue_service.py -q

    - name: Run frontend type-check
      run: |
        cd frontend
        npm run type-check

    - name: Run frontend production build
      run: |
        cd frontend
        npm run build

    - name: Validate production compose
      run: |
        cd deploy/docker
        docker compose -f docker-compose.prod.yml config -q

  security-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run security scan
      run: |
        cd bot_service
        bandit -r . -f json -o bandit-report.json
        safety check --json --output safety-report.json
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bot_service/bandit-report.json
          bot_service/safety-report.json

  performance-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    
    - name: Install dependencies
      run: |
        cd bot_service
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run performance tests
      run: |
        cd bot_service
        python -m pytest tests/ -m "not slow" --benchmark-only --benchmark-save=performance
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: bot_service/.benchmarks/
