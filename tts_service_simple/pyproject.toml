[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tts-service-simple"
version = "1.0.0"
description = "Simplified F5-TTS Microservice"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.20.0"}
pydantic = "^2.0.0"
gputil = "^1.4.0"
psutil = "^5.9.0"
aiofiles = "^23.0.0"
python-multipart = "^0.0.6"
soundfile = "^0.12.0"
librosa = "^0.10.0"
numpy = "^1.24.0"
requests = "^2.31.0"
faster-whisper = "^0.10.0"
openai-whisper = "^20231117"

[tool.ruff]
line-length = 120
target-version = "py310"
