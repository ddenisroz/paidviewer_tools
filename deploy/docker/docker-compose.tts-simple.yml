# docker-compose.tts-simple.yml
# Single-node F5 TTS deployment (no worker pool / no Redis).
# Kept as compatibility compose profile for personal setups.

services:
  tts_service:
    image: ${F5_TTS_IMAGE:-f5-tts-service:latest}
    container_name: tts_service_single
    ports:
      - "8001:8001"
    volumes:
      - tts_models:/app/models
      - tts_voices:/app/voices
      - tts_audio:/app/audio
      - tts_logs:/app/logs
      - tts_cache:/app/f5_tts_cache
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ../../cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ../../cloudflared-credentials.json:/etc/cloudflared/credentials.json:ro
    restart: unless-stopped
    depends_on:
      - tts_service

volumes:
  tts_models:
    driver: local
  tts_voices:
    driver: local
  tts_audio:
    driver: local
  tts_logs:
    driver: local
  tts_cache:
    driver: local

networks:
  default:
    name: tts_single_network
    driver: bridge



