# docker-compose.tts-advanced.yml
# Compatibility overlay for a dedicated remote f5-tts-service host.
# Current topology: provider-owned F5 service only, optionally exposed via Cloudflare Tunnel.

services:
  # Local database for provider-owned F5 voice/admin state
  postgres:
    image: postgres:15-alpine
    container_name: f5_tts_postgres
    environment:
      POSTGRES_DB: ${F5_DB_NAME:-f5_tts}
      POSTGRES_USER: ${F5_DB_USER:-f5_tts}
      POSTGRES_PASSWORD: ${F5_DB_PASSWORD:?F5_DB_PASSWORD is required}
    volumes:
      - f5_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${F5_DB_USER:-f5_tts} -d ${F5_DB_NAME:-f5_tts}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Provider-owned F5 API
  tts_service:
    image: ${F5_TTS_IMAGE:-f5-tts-service:latest}
    container_name: f5_tts_service_advanced
    ports:
      - "127.0.0.1:8011:8011"
    environment:
      - F5_TTS_SERVICE_PORT=8011
      - F5_TTS_SERVICE_PUBLIC_BASE_URL=http://tts_service:8011
      - F5_TTS_SERVICE_API_KEYS=${F5_TTS_SERVICE_API_KEY:?F5_TTS_SERVICE_API_KEY is required}
      - F5_TTS_DATABASE_URL=postgresql://${F5_DB_USER:-f5_tts}:${F5_DB_PASSWORD:?F5_DB_PASSWORD is required}@postgres:5432/${F5_DB_NAME:-f5_tts}
      - F5_TTS_DATABASE_ECHO=false
      - F5_TTS_BASE_DIR=/app
      - F5_TTS_ENGINE_MODE=real
      - F5_TTS_ENABLE_PREWARM=true
      - F5_TTS_MAX_INPUT_TEXT_LENGTH=${F5_TTS_MAX_INPUT_TEXT_LENGTH:-2000}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - HF_HOME=/app/f5_tts_cache
    volumes:
      - f5_audio:/app/audio
      - f5_logs:/app/logs
      - f5_backups:/app/backups
      - f5_cache:/app/f5_tts_cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Cloudflare Tunnel for secure remote access
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: f5_cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ../../cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ../../cloudflared-credentials.json:/etc/cloudflared/credentials.json:ro
    restart: unless-stopped
    depends_on:
      tts_service:
        condition: service_healthy

volumes:
  f5_postgres_data:
    driver: local
  f5_audio:
    driver: local
  f5_logs:
    driver: local
  f5_backups:
    driver: local
  f5_cache:
    driver: local

networks:
  default:
    name: f5_tts_advanced_network
    driver: bridge



