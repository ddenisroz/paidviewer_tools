#
# Compatibility local stack.
# Official local path is now:
# docker compose --env-file bot_service/.env --env-file deploy/docker/compose.local.env `
#   -f deploy/docker/docker-compose.prod.yml -f deploy/docker/docker-compose.local.yml `
#   --profile core --profile cloud-tts up --build
#
services:
  redis:
    image: redis:7-alpine
    container_name: tts_redis_dev
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: tts_postgres_dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app_data}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot_service:
    build:
      context: ../../bot_service
      dockerfile: Dockerfile.prod
    container_name: tts_bot_service_dev
    env_file:
      - ../../bot_service/.env
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_data}
      - SECRET_KEY=dev_secret_key_change_in_production
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-2bD0gYfJwRo_-esxNUFDXL9uBeb5GsyhQOdE31jj4n4=}
      - ALGORITHM=HS256
      - BACKEND_URL=http://localhost
      - FRONTEND_URL=http://localhost
      - TTS_GATEWAY_URL=${TTS_GATEWAY_URL:-http://tts_gateway:8010}
      - TTS_GATEWAY_API_KEY=${TTS_GATEWAY_API_KEY:-gateway-dev-key}
      - F5_TTS_SERVICE_URL=${F5_TTS_SERVICE_URL:-http://tts_service:8011}
      - F5_TTS_SERVICE_API_KEY=${F5_TTS_SERVICE_API_KEY:-f5-dev-key}
      - QWEN_TTS_SERVICE_URL=${QWEN_TTS_SERVICE_URL:-http://qwen_tts:8000}
      - QWEN_TTS_SERVICE_API_KEY=${QWEN_TTS_SERVICE_API_KEY:-qwen-dev-key}
      - QWEN_VOICE_SERVICE_URL=${QWEN_VOICE_SERVICE_URL:-}
      - QWEN_ALLOWED_MODELS=${QWEN_ALLOWED_MODELS:-}
      - QWEN_CLOUD_ALLOWED_MODELS=${QWEN_CLOUD_ALLOWED_MODELS:-}
      - QWEN_TTS_ALLOWED_MODELS=${QWEN_TTS_ALLOWED_MODELS:-}
      - REDIS_URL=redis://redis:6379/0
      - TWITCH_REDIRECT_URI=http://localhost/auth/twitch/callback
      - TWITCH_BOT_REDIRECT_URI=http://localhost/auth/twitch/bot/callback
      - VK_REDIRECT_URI=http://localhost/auth/vk/callback
      - VK_BOT_REDIRECT_URI=http://localhost/auth/vk/bot/callback
      - VK_AUTH_BASE_URL=https://auth.live.vkvideo.ru/app/oauth2/authorize
      - DONATIONALERTS_REDIRECT_URI=http://localhost/auth/donationalerts/callback
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://localhost:5173
      - SESSION_COOKIE_SECURE=false
      - SESSION_COOKIE_HTTPONLY=false
      - ENABLE_SECURITY_HEADERS=false
      - ENABLE_JSON_LOGS=false
      - ENABLE_LOG_ROTATION=false
    volumes:
      - ../../bot_service/core/data:/app/core/data
      - ../../bot_service/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tts_gateway:
        condition: service_started
      tts_service:
        condition: service_started
      qwen_tts:
        condition: service_healthy
    restart: unless-stopped

  tts_gateway:
    build:
      context: ../../../tts-gateway
      dockerfile: Dockerfile
    image: ${TTS_GATEWAY_IMAGE:-tts-gateway:local}
    container_name: tts_gateway_dev
    ports:
      - "8010:8010"
    environment:
      - TTS_GATEWAY_PORT=8010
      - TTS_GATEWAY_PUBLIC_BASE_URL=http://tts_gateway:8010
      - TTS_GATEWAY_API_KEYS=${TTS_GATEWAY_API_KEY:-gateway-dev-key}
      - TTS_GATEWAY_REDIS_URL=redis://redis:6379/0
      - TTS_GATEWAY_F5_URL=http://tts_service:8011
      - TTS_GATEWAY_F5_API_KEY=${F5_TTS_SERVICE_API_KEY:-f5-dev-key}
      - TTS_GATEWAY_QWEN_URL=http://qwen_tts:8000
      - TTS_GATEWAY_QWEN_API_KEY=${QWEN_TTS_SERVICE_API_KEY:-qwen-dev-key}
    depends_on:
      redis:
        condition: service_healthy
      tts_service:
        condition: service_started
      qwen_tts:
        condition: service_healthy
    restart: unless-stopped

  tts_service:
    build:
      context: ../../../f5-tts-service
      dockerfile: Dockerfile
    image: ${F5_TTS_IMAGE:-f5-tts-service:local}
    container_name: tts_tts_service_dev
    ports:
      - "8011:8011"
    environment:
      - F5_TTS_SERVICE_PORT=8011
      - F5_TTS_SERVICE_PUBLIC_BASE_URL=http://tts_service:8011
      - F5_TTS_SERVICE_API_KEYS=${F5_TTS_SERVICE_API_KEY:-f5-dev-key}
      - F5_TTS_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_data}
      - F5_TTS_DATABASE_ECHO=false
      - F5_TTS_BASE_DIR=/app
      - F5_TTS_ENGINE_MODE=real
      - F5_TTS_ENABLE_PREWARM=true
      - F5_TTS_RUACCENT_ENABLED=false
      - F5_TTS_MAX_INPUT_TEXT_LENGTH=2000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - HF_TOKEN=${HUGGINGFACE_TOKEN:-}
      - HF_HOME=/app/f5_tts_cache
    volumes:
      - tts_audio:/app/audio
      - tts_logs:/app/logs
      - tts_cache:/app/f5_tts_cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  qwen_tts:
    build:
      context: ../../../nano-qwen3tts-vllm
      dockerfile: Dockerfile
    image: ${QWEN_TTS_IMAGE:-nano-qwen3tts-vllm:local}
    container_name: tts_qwen_service_dev
    ports:
      - "8012:8000"
    environment:
      - PORT=8000
      - API_KEY=${QWEN_TTS_SERVICE_API_KEY:-qwen-dev-key}
      - HF_HOME=/root/.cache/huggingface
      - QWEN_VOICE_STORAGE_DIR=/app/runtime/qwen_voices
      - QWEN_ALLOWED_MODELS=${QWEN_ALLOWED_MODELS:-}
      - QWEN3_TTS_MODEL_PATH=${QWEN3_TTS_MODEL_PATH:-}
      - QWEN_TTS_ALLOWED_MODELS=${QWEN_TTS_ALLOWED_MODELS:-}
    volumes:
      - qwen_hf_cache:/root/.cache/huggingface
      - qwen_voice_storage:/app/runtime/qwen_voices
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_LOCAL_TTS_AGENT_URL: http://localhost:46321
    container_name: tts_frontend_dev
    ports:
      - "80:80"
    volumes:
      - ../../deploy/nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot_service
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  tts_audio:
    driver: local
  tts_logs:
    driver: local
  tts_cache:
    driver: local
  qwen_hf_cache:
    driver: local
  qwen_voice_storage:
    driver: local

networks:
  default:
    name: tts_network_dev
    driver: bridge


