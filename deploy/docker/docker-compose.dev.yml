version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tts_postgres_dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app_data}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot_service:
    build:
      context: ../../bot_service
      dockerfile: Dockerfile.prod
    container_name: tts_bot_service_dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_data}
      - SECRET_KEY=dev_secret_key_change_in_production
      - ALGORITHM=HS256
      - BACKEND_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - TTS_SERVICE_URL=http://localhost:8001
      - TWITCH_CLIENT_ID=your_twitch_client_id
      - TWITCH_CLIENT_SECRET=your_twitch_client_secret
      - TWITCH_REDIRECT_URI=http://localhost:8000/auth/twitch/callback
      - VK_CLIENT_ID=your_vk_client_id
      - VK_CLIENT_SECRET=your_vk_client_secret
      - VK_REDIRECT_URI=http://localhost:8000/auth/vk/callback
      - VK_AUTH_BASE_URL=https://auth.live.vkvideo.ru/app/oauth2/authorize
      - YOUTUBE_API_KEY=your_youtube_api_key
      - DONATIONALERTS_CLIENT_ID=your_da_client_id
      - DONATIONALERTS_CLIENT_SECRET=your_da_client_secret
      - HUGGINGFACE_TOKEN=your_hf_token
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SESSION_COOKIE_SECURE=false
      - SESSION_COOKIE_HTTPONLY=false
      - ENABLE_SECURITY_HEADERS=false
      - ENABLE_JSON_LOGS=false
      - ENABLE_LOG_ROTATION=false
    volumes:
      - ../../bot_service/core/data:/app/core/data
      - ../../bot_service/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  tts_service:
    build:
      context: ../../tts_service
      dockerfile: Dockerfile.prod
    container_name: tts_tts_service_dev
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - TTS_DEBUG=true
      - TTS_LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_data}
      - HUGGINGFACE_TOKEN=your_hf_token
      - HF_HOME=/app/f5_tts_cache
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - TTS_WORKERS=2
    volumes:
      - ../../tts_service/audio:/app/audio
      - ../../tts_service/logs:/app/logs
      - tts_cache:/app/f5_tts_cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_BOT_SERVICE_URL=http://localhost:8000
        - VITE_BOT_SERVICE_WS_URL=ws://localhost:8000
        - VITE_TTS_SERVICE_URL=http://localhost:8001
    container_name: tts_frontend_dev
    ports:
      - "80:80"
    volumes:
      - ../../deploy/nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot_service
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  tts_cache:
    driver: local

networks:
  default:
    name: tts_network_dev
    driver: bridge
