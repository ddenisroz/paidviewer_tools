<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥚</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payedviewer</title>
    
    <!-- Preconnect to external domains (early connection) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- DNS prefetch для API -->
    <link rel="dns-prefetch" href="//localhost:8000">
    
    <!-- CRITICAL: Font loading with optional display to prevent visible swap -->
    <!-- display=optional shows fallback immediately, uses custom font only if already cached -->
    <!-- This prevents visible font expansion on first load - system font stays, Inter loads silently -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional">
    
    <!-- Resource hints для ускорения загрузки -->
    <link rel="modulepreload" href="/src/main.jsx">
    
    <!-- Fallback: if stylesheet fails, we already have inline CSS with system fonts -->
    
    <!-- Critical CSS inline to prevent FOUT -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        height: 100%;
        overflow-y: auto;
      }
      
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        /* Use system fonts as primary - Inter will swap silently if cached */
        /* This prevents visible font expansion - system font stays visible */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 14px;
        line-height: 1.5;
        font-weight: 400;
        background-color: hsl(260, 30%, 8%);
        color: hsl(270, 20%, 95%);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Show content immediately - fonts will load in background */
        visibility: visible;
        opacity: 1;
      }
      
      /* Apply Inter font only after it's confirmed loaded to prevent expansion */
      /* With font-display: optional, Inter only swaps if already cached */
      body.fonts-ready .inter-font,
      body.fonts-ready {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      
      /* Fonts are preloaded, body is always visible */
      /* Class fonts-loaded is added immediately in main.jsx */
      
      /* Base font sizes to prevent FOUT - using rem units for consistency */
      /* These sizes match exactly with Tailwind defaults */
      .text-xs { font-size: 0.75rem !important; line-height: 1rem !important; }
      .text-sm { font-size: 0.875rem !important; line-height: 1.25rem !important; }
      .text-base { font-size: 1rem !important; line-height: 1.5rem !important; }
      .text-lg { font-size: 1.125rem !important; line-height: 1.75rem !important; }
      .text-xl { font-size: 1.25rem !important; line-height: 1.75rem !important; }
      .text-2xl { font-size: 1.5rem !important; line-height: 2rem !important; }
      .text-3xl { font-size: 1.875rem !important; line-height: 2.25rem !important; }
      
      /* Ensure all text elements use consistent sizing */
      p, span, div, button, input, textarea, label, a {
        font-size: inherit;
        line-height: inherit;
      }
      
      /* Prevent layout shift */
      #root {
        min-height: 100vh;
        width: 100%;
        /* Root is visible immediately - React mounts normally */
        opacity: 1;
        visibility: visible;
      }
      
      /* Hide scrollbar initially */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      
      html {
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Minimal loading state - removed on mount -->
      <style>
        #root:empty::before {
          content: '';
          display: block;
          width: 100%;
          height: 100vh;
          background-color: hsl(260, 30%, 8%);
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
